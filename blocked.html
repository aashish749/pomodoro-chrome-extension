<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blocked - Pomodoro</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: #f5f5f7;
      }
      .container {
        text-align: center;
        max-width: 420px;
        padding: 48px 40px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }
      .icon {
        font-size: 56px;
        margin-bottom: 16px;
      }
      h1 {
        color: #b81d18;
        margin-bottom: 12px;
        font-size: 24px;
      }
      .channel-name {
        color: #555;
        font-size: 14px;
        margin-bottom: 16px;
      }
      p {
        color: #555;
        line-height: 1.6;
        font-size: 15px;
        margin: 0 0 20px 0;
      }
      .bonus-btn {
        display: inline-block;
        padding: 12px 28px;
        background: #b81d18;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
      }
      .bonus-btn:hover {
        background: #941310;
      }
      .bonus-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      .bonus-msg {
        font-size: 13px;
        margin-top: 12px;
        display: none;
      }
      .bonus-msg.success {
        color: #2ecc71;
      }
      .bonus-msg.error {
        color: #e74c3c;
      }
      .bonus-used-msg {
        font-size: 13px;
        color: #999;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">🚫</div>
      <h1>Time's up!</h1>
      <div class="channel-name" id="channelName"></div>
      <p id="blockMessage">
        You've reached your daily limit for this channel. Time to get back to
        work!
      </p>
      <div class="bonus-section">
        <button class="bonus-btn" id="bonusBtn">Give me +5 minutes</button>
        <div class="bonus-msg" id="bonusMsg"></div>
        <div class="bonus-used-msg" id="bonusUsedMsg"></div>
      </div>
    </div>

    <script src="blocked.js"></script>
  </body>
</html>
